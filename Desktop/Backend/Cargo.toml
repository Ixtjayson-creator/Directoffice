[package]
name = "directoffice-desktop"
version = "0.1.0"
description = "DirectOffice Desktop Backend"
authors = ["DirectOffice Team"]
edition = "2021"

[lib]
name = "directoffice_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"

